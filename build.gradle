plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { eclipse_grimoire { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            args '--nogui'
            mods { eclipse_grimoire { source sourceSets.main } }
        }
    }
}
repositories { mavenCentral() }
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }

sourceSets.main.resources { srcDir 'src/generated/resources' }
processResources {
    inputs.property 'version', mod_version
    filesMatching('META-INF/mods.toml') { expand 'version': mod_version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar {
    manifest { attributes(['Specification-Title': 'The Eclipse Grimoire',
                           'Implementation-Title': project.name,
                           'Implementation-Version': version]) }
    finalizedBy 'reobfJar'
}
