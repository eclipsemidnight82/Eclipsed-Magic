name: Build The Eclipse Grimoire (Forge 1.20.1)

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eclipse_grimoire_safe_build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download official Forge MDK Gradle wrapper
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/forge-mdk.zip" \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.0/forge-1.20.1-47.4.0-mdk.zip
          mkdir -p "$RUNNER_TEMP/forge-mdk"
          unzip -q "$RUNNER_TEMP/forge-mdk.zip" 'gradlew' 'gradle/wrapper/*' -d "$RUNNER_TEMP/forge-mdk"
          cp -R "$RUNNER_TEMP/forge-mdk/gradle" .
          cp "$RUNNER_TEMP/forge-mdk/gradlew" .
          chmod +x gradlew

      - name: Apply and verify Alpha 0.11.4 Visual Consistency source
        run: |
          set -euo pipefail
          archive="../The_Eclipse_Grimoire_GitHub_Update_0.11.4.zip"
          test -s "$archive" || { echo 'Missing Alpha 0.11.4 source ZIP in repository root' >&2; exit 1; }
          unzip -tq "$archive"
          unzip -o -q "$archive" -d .
          grep -Fxq 'mod_version=0.11.4-alpha' gradle.properties || { echo 'Wrong version: refusing stale build' >&2; exit 1; }
          for source in EclipseMod EclipseNetwork ScryingMagic ScryingCrystalBlock BloodChaliceBlock BloodRelicsData BloodImmortality BloodPoppetRecipe WardPoppetRecipe TaglockItem PoppetItem MagicData EclipseCommands; do
            test -s "src/main/java/io/github/eclipsegrimoire/${source}.java" || { echo "Missing ${source}" >&2; exit 1; }
          done
          for source in ScryingScreen ScryRegistryScreen GrimoireScreen BloodTaglockModel; do
            test -s "src/main/java/io/github/eclipsegrimoire/client/${source}.java" || { echo "Missing client ${source}" >&2; exit 1; }
          done
          grep -Fq 'poppet_state' src/main/java/io/github/eclipsegrimoire/client/BloodTaglockModel.java
          grep -Fq 'super(id,category)' src/main/java/io/github/eclipsegrimoire/BloodPoppetRecipe.java
          grep -Fq 'super(id,category)' src/main/java/io/github/eclipsegrimoire/WardPoppetRecipe.java
          test "$(grep -c 'void appendHoverText(' src/main/java/io/github/eclipsegrimoire/PoppetItem.java)" -eq 1 || { echo 'Poppet tooltip method duplicated' >&2; exit 1; }
          test -s src/main/resources/assets/eclipse_grimoire/textures/item/blood_taglock_blood.png
          test -s src/main/resources/assets/eclipse_grimoire/textures/item/poppet_protected.png
          test -s src/main/resources/assets/eclipse_grimoire/models/block/blood_chalice_blood.json
          test -s src/main/resources/assets/eclipse_grimoire/models/block/scrying_crystal_bound.json
          python3 - <<'PYVALID'
          import pathlib,json
          root=pathlib.Path('src/main/resources')
          files=list(root.rglob('*.json'))
          for path in files: json.loads(path.read_text())
          assets=root/'assets/eclipse_grimoire'
          for name in ('scrying_crystal_empty','scrying_crystal_bound'):
              model=json.loads((assets/'models/block'/f'{name}.json').read_text())
              assert model.get('render_type')=='minecraft:translucent'
          for name in ('blood_chalice_empty','blood_chalice_blood'):
              model=json.loads((assets/'models/block'/f'{name}.json').read_text())
              assert len(model.get('elements',[]))>=15
          for name in ('blood_taglock','poppet'):
              model=json.loads((assets/'models/item'/f'{name}.json').read_text())
              assert model.get('overrides')
          print('Validated',len(files),'JSON resources, translucent crystal, filled chalice, dynamic icon models')
          PYVALID
          python3 - <<'PYVISUAL'
          import json,pathlib,struct
          base=pathlib.Path('src/main/resources/assets/eclipse_grimoire')
          model=json.loads((base/'models/block/witch_bell.json').read_text())
          assert model['textures']['particle']=='#frame', 'Bell texture must be a valid reference'
          for ref in ('frame','bell','gem'):
              name=model['textures'][ref].split(':',1)[1]
              assert (base/'textures'/f'{name}.png').is_file(),f'Missing bell texture: {name}'
          item=json.loads((base/'models/item/witch_bell.json').read_text())
          assert item['parent']=='eclipse_grimoire:block/witch_bell'
          empty=(base/'textures/item/blood_taglock.png').read_bytes()
          blood=(base/'textures/item/blood_taglock_blood.png').read_bytes()
          assert empty!=blood and empty.startswith(b'\x89PNG') and blood.startswith(b'\x89PNG')
          assert empty[16:24]==blood[16:24], 'Taglock images must share pixel dimensions'
          print('Verified bell texture references and consistent taglock artwork')
          PYVISUAL

          echo 'Alpha 0.11.4 Visual Consistency sources and resources verified.'

      - name: Compile Alpha 0.11.4 Forge mod
        run: ./gradlew --no-daemon build

      - name: Upload compiled Alpha 0.11.4 JAR
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-grimoire-forge-1.20.1-alpha-0.11.4
          path: eclipse_grimoire_safe_build/build/libs/*.jar
          if-no-files-found: error
