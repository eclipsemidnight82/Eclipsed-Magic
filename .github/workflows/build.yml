name: Build The Eclipse Grimoire (Forge 1.20.1)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eclipse_grimoire_safe_build
    steps:
      - name: Check out mod sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download official Forge MDK Gradle wrapper
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/forge-mdk.zip" \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.0/forge-1.20.1-47.4.0-mdk.zip
          mkdir -p "$RUNNER_TEMP/forge-mdk"
          unzip -q "$RUNNER_TEMP/forge-mdk.zip" 'gradlew' 'gradle/wrapper/*' -d "$RUNNER_TEMP/forge-mdk"
          cp -R "$RUNNER_TEMP/forge-mdk/gradle" .
          cp "$RUNNER_TEMP/forge-mdk/gradlew" .
          chmod +x gradlew

      - name: Apply the uploaded Alpha 0.3.0 ZIP to Forge source tree
        run: |
          set -euo pipefail
          zip_file="../The_Eclipse_Grimoire_GitHub_Root_Update_0.3.0.zip"
          if [[ ! -f "$zip_file" ]]; then
            echo "Missing Alpha 0.3.0 ZIP at repository root: $zip_file" >&2
            exit 1
          fi
          src="$RUNNER_TEMP/eclipse-alpha-0.3.0"
          mkdir -p "$src"
          unzip -q "$zip_file" -d "$src"
          test -f "$src/EclipseMod.java"
          test -f "$src/EclipseNetwork.java"
          test -f "$src/ClientBook.java"
          test -f "$src/SpellCasting.java"
          test -f "$src/build.gradle"
          test -f "$src/gradle.properties"
          for java_file in "$src"/*.java; do
            name="${java_file##*/}"
            case "$name" in
              ClientEvents.java|GrimoireScreen.java|ClientBook.java)
                cp -v "$java_file" "src/main/java/io/github/eclipsegrimoire/client/$name" ;;
              *)
                cp -v "$java_file" "src/main/java/io/github/eclipsegrimoire/$name" ;;
            esac
          done
          cp "$src/build.gradle" ./build.gradle
          cp "$src/gradle.properties" ./gradle.properties
          grep -q '^mod_version=0.3.0-alpha$' gradle.properties
          grep -q 'case "shatter"' src/main/java/io/github/eclipsegrimoire/SpellCasting.java
          grep -q 'EclipseNetwork' src/main/java/io/github/eclipsegrimoire/EclipseMod.java
          test -f src/main/java/io/github/eclipsegrimoire/EclipseNetwork.java
          test -f src/main/java/io/github/eclipsegrimoire/client/ClientBook.java
          echo "Confirmed: Alpha 0.3.0 files have replaced old source in Forge build directory."

      - name: Compile Alpha 0.3.0 Forge mod
        run: ./gradlew --no-daemon build

      - name: Upload compiled mod (only if build succeeds)
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-grimoire-forge-1.20.1-alpha-0.3.0
          path: eclipse_grimoire_safe_build/build/libs/*.jar
          if-no-files-found: error
