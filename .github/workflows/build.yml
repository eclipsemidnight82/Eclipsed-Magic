name: Build The Eclipse Grimoire (Forge 1.20.1)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eclipse_grimoire_safe_build
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download official Forge MDK Gradle wrapper
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/forge-mdk.zip" \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.0/forge-1.20.1-47.4.0-mdk.zip
          mkdir -p "$RUNNER_TEMP/forge-mdk"
          unzip -q "$RUNNER_TEMP/forge-mdk.zip" 'gradlew' 'gradle/wrapper/*' -d "$RUNNER_TEMP/forge-mdk"
          cp -R "$RUNNER_TEMP/forge-mdk/gradle" .
          cp "$RUNNER_TEMP/forge-mdk/gradlew" .
          chmod +x gradlew

      - name: Apply Alpha 0.5.0 source ZIP
        run: |
          set -euo pipefail
          zip_file="../The_Eclipse_Grimoire_GitHub_Update_0.5.0.zip"
          test -f "$zip_file" || { echo "Missing update ZIP in repository root: $zip_file" >&2; exit 1; }
          unzip -o -q "$zip_file" -d .
          grep -q '^mod_version=0.5.0-alpha$' gradle.properties
          test -f src/main/java/io/github/eclipsegrimoire/TetherMagic.java
          grep -q '"tether".equals(spell)' src/main/java/io/github/eclipsegrimoire/SpellCasting.java
          grep -q '"tether","Arcane Tether"' src/main/java/io/github/eclipsegrimoire/client/SpellWheel.java
          grep -q 'class ArcaneButton extends Button' src/main/java/io/github/eclipsegrimoire/client/GrimoireScreen.java
          test -f src/main/resources/assets/eclipse_grimoire/textures/block/infused_salt_purple.png
          echo "Verified: Alpha 0.5.0 source with styled grimoire and Arcane Tether"

      - name: Compile Alpha 0.5.0 Forge mod
        run: ./gradlew --no-daemon build

      - name: Upload compiled mod if build succeeds
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-grimoire-forge-1.20.1-alpha-0.5.0
          path: eclipse_grimoire_safe_build/build/libs/*.jar
          if-no-files-found: error
