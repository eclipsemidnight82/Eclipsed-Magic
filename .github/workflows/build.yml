name: Build The Eclipse Grimoire (Forge 1.20.1)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eclipse_grimoire_safe_build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download official Forge MDK Gradle wrapper
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/forge-mdk.zip" \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.0/forge-1.20.1-47.4.0-mdk.zip
          mkdir -p "$RUNNER_TEMP/forge-mdk"
          unzip -q "$RUNNER_TEMP/forge-mdk.zip" 'gradlew' 'gradle/wrapper/*' -d "$RUNNER_TEMP/forge-mdk"
          cp -R "$RUNNER_TEMP/forge-mdk/gradle" .
          cp "$RUNNER_TEMP/forge-mdk/gradlew" .
          chmod +x gradlew

      - name: Apply Alpha 0.7.2 source update
        run: |
          set -euo pipefail
          archive="../The_Eclipse_Grimoire_GitHub_Update_0.7.2.zip"
          if [[ ! -f "$archive" ]]; then
            echo "Upload the Alpha 0.7.2 ZIP to the repository root." >&2
            exit 1
          fi
          unzip -tq "$archive"
          unzip -o -q "$archive" -d .
          grep -Fxq 'mod_version=0.7.2-alpha' gradle.properties || { echo 'Wrong mod version; refusing to build stale sources' >&2; exit 1; }
          # Check actual structure and identifiers, not fragile exact switch-case formatting.
          for source in SpellCasting MagicData WardData EclipseCommands EclipseNetwork; do
            test -s "src/main/java/io/github/eclipsegrimoire/${source}.java" || exit 1
          done
          for source in GrimoireScreen SpellWheel WheelPreferences ArcaneRender; do
            test -s "src/main/java/io/github/eclipsegrimoire/client/${source}.java" || exit 1
          done
          grep -Fq 'new SpellDef("Absolute Seal","absolute"' src/main/java/io/github/eclipsegrimoire/client/GrimoireScreen.java
          grep -Fq 'new Entry("absolute","Absolute Seal"' src/main/java/io/github/eclipsegrimoire/client/SpellWheel.java
          grep -Fq 'bookScale()' src/main/java/io/github/eclipsegrimoire/client/GrimoireScreen.java
          grep -Fq 'v.vertex(matrix.pose(),' src/main/java/io/github/eclipsegrimoire/client/ArcaneRender.java
          echo 'Confirmed: Alpha 0.7.2 installed; named Absolute Seal and responsive book are present.'

      - name: Compile Alpha 0.7.2 Forge mod
        run: ./gradlew --no-daemon build

      - name: Upload compiled Alpha 0.7.2 mod
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-grimoire-forge-1.20.1-alpha-0.7.2
          path: eclipse_grimoire_safe_build/build/libs/*.jar
          if-no-files-found: error
