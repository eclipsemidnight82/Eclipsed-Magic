name: Build The Eclipse Grimoire (Forge 1.20.1)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eclipse_grimoire_safe_build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download official Forge MDK Gradle wrapper
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/forge-mdk.zip" \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.0/forge-1.20.1-47.4.0-mdk.zip
          mkdir -p "$RUNNER_TEMP/forge-mdk"
          unzip -q "$RUNNER_TEMP/forge-mdk.zip" 'gradlew' 'gradle/wrapper/*' -d "$RUNNER_TEMP/forge-mdk"
          cp -R "$RUNNER_TEMP/forge-mdk/gradle" .
          cp "$RUNNER_TEMP/forge-mdk/gradlew" .
          chmod +x gradlew

      - name: Apply Alpha 0.7.1 source update
        run: |
          set -euo pipefail
          archive="../The_Eclipse_Grimoire_GitHub_Update_0.7.1.zip"
          if [[ ! -f "$archive" ]]; then
            echo "Missing Alpha 0.7.1 ZIP in repository root: $archive" >&2
            exit 1
          fi
          unzip -tq "$archive"
          unzip -o -q "$archive" -d .
          grep -Fxq 'mod_version=0.7.1-alpha' gradle.properties || { echo '0.7.1 version was not applied' >&2; exit 1; }
          for source in EclipseEvents WardData MagicInteractions MotionMagic SpellCasting EclipseNetwork ArcaneEffects; do
            test -s "src/main/java/io/github/eclipsegrimoire/${source}.java" || { echo "Missing $source" >&2; exit 1; }
          done
          for source in ArcaneRender SpellWheel WheelPreferences GrimoireScreen; do
            test -s "src/main/java/io/github/eclipsegrimoire/client/${source}.java" || { echo "Missing $source" >&2; exit 1; }
          done
          test -s src/main/resources/assets/eclipse_grimoire/textures/block/infused_salt_purple.png
          echo 'Alpha 0.7.1 source, door seals, visuals and compact spell wheel found.'

      - name: Compile Alpha 0.7.1 Forge mod
        run: ./gradlew --no-daemon build

      - name: Upload compiled mod only on success
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-grimoire-forge-1.20.1-alpha-0.7.1
          path: eclipse_grimoire_safe_build/build/libs/*.jar
          if-no-files-found: error
