name: Build The Eclipse Grimoire (Forge 1.20.1)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eclipse_grimoire_safe_build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download official Forge MDK Gradle wrapper
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/forge-mdk.zip" \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.0/forge-1.20.1-47.4.0-mdk.zip
          mkdir -p "$RUNNER_TEMP/forge-mdk"
          unzip -q "$RUNNER_TEMP/forge-mdk.zip" 'gradlew' 'gradle/wrapper/*' -d "$RUNNER_TEMP/forge-mdk"
          cp -R "$RUNNER_TEMP/forge-mdk/gradle" .
          cp "$RUNNER_TEMP/forge-mdk/gradlew" .
          chmod +x gradlew

      - name: Apply and verify Alpha 0.10.1 UI update
        run: |
          set -euo pipefail
          archive="../The_Eclipse_Grimoire_GitHub_Update_0.10.1.zip"
          test -s "$archive" || { echo "Missing Alpha 0.10.1 ZIP in repository root" >&2; exit 1; }
          unzip -tq "$archive"
          unzip -o -q "$archive" -d .
          grep -Fxq 'mod_version=0.10.1-alpha' gradle.properties || { echo 'Refusing to build the wrong alpha version' >&2; exit 1; }
          ui=src/main/java/io/github/eclipsegrimoire/client/GrimoireScreen.java
          test -s "$ui"
          grep -Fq 'Chapter.CONTENTS' "$ui"
          grep -Fq 'TABLE OF CONTENTS' "$ui"
          grep -Fq 'spellSpreadCount()' "$ui"
          grep -Fq 'case RITUALS->RITES.length' "$ui"
          grep -Fq 'case COVEN->Math.max(2,' "$ui"
          for source in EclipseMod RitualMagic HexMagic PoppetItem RuneMagic CovenData MagicData; do
            test -s "src/main/java/io/github/eclipsegrimoire/${source}.java" || { echo "Missing preserved source: $source" >&2; exit 1; }
          done
          for source in SpellWheel WheelPreferences; do
            test -s "src/main/java/io/github/eclipsegrimoire/client/${source}.java" || { echo "Missing preserved UI source: $source" >&2; exit 1; }
          done
          for removed in BroomConfig BroomEntity BroomItem; do
            test ! -f "src/main/java/io/github/eclipsegrimoire/${removed}.java" || { echo "Retired broom file still present" >&2; exit 1; }
          done
          echo 'Confirmed: Alpha 0.10.1 Contents-based grimoire with preserved 0.10.0 gameplay.'

      - name: Compile Alpha 0.10.1 Forge mod
        run: ./gradlew --no-daemon build

      - name: Upload compiled Alpha 0.10.1 mod
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-grimoire-forge-1.20.1-alpha-0.10.1
          path: eclipse_grimoire_safe_build/build/libs/*.jar
          if-no-files-found: error
