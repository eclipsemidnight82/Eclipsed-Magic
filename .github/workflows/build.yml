name: Build The Eclipse Grimoire (Forge 1.20.1)

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eclipse_grimoire_safe_build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download official Forge MDK Gradle wrapper
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/forge-mdk.zip" \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.0/forge-1.20.1-47.4.0-mdk.zip
          mkdir -p "$RUNNER_TEMP/forge-mdk"
          unzip -q "$RUNNER_TEMP/forge-mdk.zip" 'gradlew' 'gradle/wrapper/*' -d "$RUNNER_TEMP/forge-mdk"
          cp -R "$RUNNER_TEMP/forge-mdk/gradle" .
          cp "$RUNNER_TEMP/forge-mdk/gradlew" .
          chmod +x gradlew

      - name: Apply and verify Alpha 0.11.1 True Scrying source
        run: |
          set -euo pipefail
          archive="../The_Eclipse_Grimoire_GitHub_Update_0.11.1.zip"
          test -s "$archive" || { echo "Missing Alpha 0.11.1 update ZIP in repository root" >&2; exit 1; }
          unzip -tq "$archive"
          unzip -o -q "$archive" -d .
          grep -Fxq 'mod_version=0.11.1-alpha' gradle.properties || { echo 'Wrong version: refusing stale build' >&2; exit 1; }
          for source in EclipseMod EclipseNetwork ScryingMagic ScryingCrystalBlock BloodRelicsData BloodImmortality BloodPoppetRecipe WardPoppetRecipe; do
            test -s "src/main/java/io/github/eclipsegrimoire/${source}.java" || { echo "Missing ${source}" >&2; exit 1; }
          done
          for source in ScryingScreen ClientEvents GrimoireScreen; do
            test -s "src/main/java/io/github/eclipsegrimoire/client/${source}.java" || { echo "Missing client ${source}" >&2; exit 1; }
          done
          grep -Fq 'new ScryTarget(' src/main/java/io/github/eclipsegrimoire/EclipseNetwork.java
          grep -Fq 'mc.setCameraEntity(target)' src/main/java/io/github/eclipsegrimoire/client/ScryingScreen.java
          grep -Fq 'mc.setCameraEntity(mc.player)' src/main/java/io/github/eclipsegrimoire/client/ScryingScreen.java
          grep -Fq 'super(id,category)' src/main/java/io/github/eclipsegrimoire/BloodPoppetRecipe.java
          grep -Fq 'super(id,category)' src/main/java/io/github/eclipsegrimoire/WardPoppetRecipe.java
          if grep -Fq 'LIVE ARCANE OVERHEAD VISION' src/main/java/io/github/eclipsegrimoire/client/ScryingScreen.java; then
            echo 'Refusing to build old overhead scry UI' >&2; exit 1
          fi
          python3 - <<'PYVALID'
          import json,pathlib
          assets=list(pathlib.Path('src/main/resources').rglob('*.json'))
          for f in assets:json.loads(f.read_text())
          print('Validated',len(assets),'JSON resources')
          PYVALID
          echo 'True Scrying sources, recipe fixes and resources verified.'

      - name: Compile Alpha 0.11.1 Forge mod
        run: ./gradlew --no-daemon build

      - name: Upload compiled Alpha 0.11.1 JAR
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-grimoire-forge-1.20.1-alpha-0.11.1
          path: eclipse_grimoire_safe_build/build/libs/*.jar
          if-no-files-found: error
